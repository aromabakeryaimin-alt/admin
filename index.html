<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>車務管理及掃碼系統</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --primary: #2563eb; --bg: #f1f5f9; --card: #ffffff; --text: #1e293b; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }
        .card { background: var(--card); padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; color: var(--primary); border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9em; }
        input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 6px; }
        .hint { font-size: 0.8em; color: #64748b; margin-top: 4px; }
        button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #1d4ed8; }
        #reader { width: 100%; margin: 15px 0; border-radius: 8px; overflow: hidden; }
        .result-box { margin-top: 15px; padding: 15px; border-radius: 8px; font-weight: bold; text-align: center; }
        .success { background: #dcfce7; color: #166534; }
        .error { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>
    <div class="container">
        <!-- 批量新增班次區 -->
        <div class="card">
            <h2>🚌 批量發佈班次</h2>
            <div class="form-group">
                <label>出發地 及 目的地</label>
                <div style="display:flex; gap:10px;">
                    <input type="text" id="origin" placeholder="例: 旺角">
                    <input type="text" id="destination" placeholder="例: 尖沙咀">
                </div>
            </div>
            <div class="form-group">
                <label>日期範圍 (可設定未來一個月)</label>
                <div style="display:flex; gap:10px;">
                    <input type="date" id="startDate">
                    <input type="date" id="endDate">
                </div>
            </div>
            <div class="form-group">
                <label>發車時段 (用逗號分隔)</label>
                <input type="text" id="times" placeholder="例: 08:00, 12:30, 18:00">
                <div class="hint">系統會自動為上述每一天生成這些時段的班次</div>
            </div>
            <div class="form-group">
                <label>單程價格 ($)</label>
                <input type="number" id="price" placeholder="例: 20">
            </div>
            <button onclick="window.batchAddSchedules()">大量產生班次</button>
            <div id="scheduleMsg" style="margin-top: 15px; text-align: center; font-weight: bold;"></div>
        </div>

        <!-- 掃描系統區 -->
        <div class="card">
            <h2>📷 驗證上車系統</h2>
            <p style="font-size: 0.9em; color: #64748b;">支援單程票(1次)及來回票(2次)掃描</p>
            <div id="reader"></div>
            <div class="form-group" style="margin-top: 15px;">
                <label>手動輸入車票號碼</label>
                <input type="text" id="manualTicketId" placeholder="TKT-XXXXXX">
            </div>
            <button onclick="window.verifyTicket(document.getElementById('manualTicketId').value.trim())" style="background:#0f766e;">手動核銷</button>
            <div id="scanResult" class="result-box" style="display:none;"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, set, get, child, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCq_8FSy5JU9-ETd1F3whQHwXC_fY1uqdo",
            authDomain: "admin-bus2026.firebaseapp.com",
            databaseURL: "https://admin-bus2026-default-rtdb.firebaseio.com",
            projectId: "admin-bus2026",
            storageBucket: "admin-bus2026.firebasestorage.app",
            messagingSenderId: "465878874061",
            appId: "1:465878874061:web:f967bd130caf9546abb684"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // 批量新增班次
        window.batchAddSchedules = async function() {
            const origin = document.getElementById('origin').value;
            const dest = document.getElementById('destination').value;
            const startDateStr = document.getElementById('startDate').value;
            const endDateStr = document.getElementById('endDate').value;
            const timeStr = document.getElementById('times').value;
            const price = document.getElementById('price').value;
            const msg = document.getElementById('scheduleMsg');

            if(!origin || !dest || !startDateStr || !endDateStr || !timeStr || !price) {
                msg.innerHTML = "<span style='color:red;'>請填寫所有欄位！</span>"; return;
            }

            const times = timeStr.split(',').map(t => t.trim()).filter(t => t !== "");
            let currentD = new Date(startDateStr);
            const endD = new Date(endDateStr);
            let count = 0;

            msg.innerHTML = "<span style='color:#2563eb;'>正在生成班次中...</span>";

            while(currentD <= endD) {
                const dateString = currentD.toISOString().split('T')[0];
                for(let time of times) {
                    const newRef = push(ref(db, 'schedules'));
                    await set(newRef, { id: newRef.key, origin, destination: dest, date: dateString, time, price, createdAt: Date.now() });
                    count++;
                }
                currentD.setDate(currentD.getDate() + 1); // 加一天
            }
            msg.innerHTML = `<span style='color:green;'>✅ 成功發佈 ${count} 個班次！</span>`;
        };

        // 驗證車票
        window.verifyTicket = function(ticketId) {
            const resultBox = document.getElementById('scanResult');
            resultBox.style.display = 'block';
            if(!ticketId) { resultBox.className = 'result-box error'; resultBox.innerHTML = "請輸入票號"; return; }

            get(child(ref(db), `tickets/${ticketId}`)).then((snapshot) => {
                if (snapshot.exists()) {
                    const ticketData = snapshot.val();
                    if (ticketData.scansLeft > 0) {
                        // 扣減次數
                        const newScansLeft = ticketData.scansLeft - 1;
                        update(ref(db, `tickets/${ticketId}`), { scansLeft: newScansLeft, lastUsedAt: Date.now() }).then(() => {
                            resultBox.className = 'result-box success';
                            let tripType = ticketData.type === 'round' ? '來回票' : '單程票';
                            let remainMsg = newScansLeft > 0 ? `(此票還可再掃描 ${newScansLeft} 次以作回程)` : `(車票已用盡)`;
                            resultBox.innerHTML = `✅ 掃描成功！<br>車票類型：${tripType}<br>剩餘次數：${newScansLeft} 次 <br><span style='font-size:0.8em'>${remainMsg}</span>`;
                        });
                    } else {
                        resultBox.className = 'result-box error';
                        resultBox.innerHTML = `❌ 無效操作：此車票使用次數已盡！<br>(${ticketId})`;
                    }
                } else {
                    resultBox.className = 'result-box error'; resultBox.innerHTML = `❌ 查無此票：${ticketId}`;
                }
            });
        };

        function onScanSuccess(decodedText) { window.verifyTicket(decodedText.trim()); }
        let scanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: {width: 250, height: 250} }, false);
        scanner.render(onScanSuccess);
    </script>
</body>
</html>
